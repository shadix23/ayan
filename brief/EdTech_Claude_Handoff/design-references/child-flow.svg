<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">Схема детского кабинета со светлячком</title><desc id="desc">Мой день, большая карточка урока о долях, отдельные игры и видео, предсказуемые шаги.</desc>
<rect width="1440" height="1000" fill="#F8F5ED"/><g font-family="Arial,sans-serif" fill="#17313E">
<text x="72" y="72" font-size="25" font-weight="bold">УЧИМСЯ СО СВЕТЛЯЧКОМ</text><text x="1130" y="72" font-size="22">RU / ҚАЗ　Помощь</text>
<rect x="64" y="108" width="1312" height="68" rx="20" fill="white"/><text x="100" y="151" font-size="23" fill="#126B68">Мой день</text><text x="290" y="151" font-size="23">Игры</text><text x="430" y="151" font-size="23">Видео</text>
<text x="72" y="246" font-size="42" font-weight="bold">Сегодня исследуем доли</text><text x="72" y="291" font-size="23">Один понятный шаг за раз. Можно не спешить.</text>
<rect x="64" y="330" width="960" height="320" rx="28" fill="white"/><text x="104" y="385" font-size="21" fill="#126B68">ТВОЙ УРОК · МАТЕМАТИКА</text><text x="104" y="441" font-size="34" font-weight="bold">Что такое четверть?</text><text x="104" y="487" font-size="23">1. Объяснение　→　2. Игра　→　3. Результат</text><rect x="104" y="536" width="350" height="68" rx="18" fill="#126B68"/><text x="146" y="579" font-size="26" fill="white">Продолжить урок →</text>
<g transform="translate(1194 455)"><ellipse cx="-68" cy="0" rx="44" ry="23" fill="#D9E8DE" transform="rotate(-25)"/><ellipse cx="68" cy="0" rx="44" ry="23" fill="#D9E8DE" transform="rotate(25)"/><ellipse cy="66" rx="53" ry="53" fill="#F5B57A"/><ellipse rx="67" ry="80" fill="#A5DED3"/><ellipse cy="-15" rx="49" ry="42" fill="#FFF2D7"/><circle cx="-18" cy="-22" r="8"/><circle cx="18" cy="-22" r="8"/><path d="M-12 2 Q0 16 12 2" fill="none" stroke="#17313E" stroke-width="4"/><path d="M-25-72 L-34-103 M25-72 L34-103" stroke="#17313E" stroke-width="5"/><circle cx="-34" cy="-103" r="8" fill="#F5B57A"/><circle cx="34" cy="-103" r="8" fill="#F5B57A"/></g>
<text x="1090" y="626" font-size="20">Светлячок рядом,</text><text x="1090" y="655" font-size="20">когда нужна помощь</text>
<rect x="64" y="690" width="636" height="165" rx="24" fill="white"/><text x="100" y="742" font-size="29" font-weight="bold">Игры</text><text x="100" y="782" font-size="22">Потренируйся на знакомых примерах</text><text x="100" y="822" font-size="22" fill="#126B68">Выбрать игру →</text>
<rect x="724" y="690" width="652" height="165" rx="24" fill="white"/><text x="760" y="742" font-size="29" font-weight="bold">Видео</text><text x="760" y="782" font-size="22">Математика · Природа · Информатика</text><text x="760" y="822" font-size="22" fill="#126B68">Смотреть объяснения →</text>
<text x="72" y="925" font-size="19">Оригинальная схема для обсуждения. Текст, роли и состояния адаптировать к реальному проекту.</text>
</g></svg>
