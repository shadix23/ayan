<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аян · кабинет учителя</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/ayan-mark.svg">
<link rel="preload" href="/fonts/Nunito.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/v2/tokens.css">
<link rel="stylesheet" href="/v2/lights.css">
<style>
 /* fixes round 1: teacher pulse marks, next-example window, lost session (teacher-only, kept out of the shared lights.css) */
 a.sr-only:focus{position:fixed!important;left:16px;top:12px;width:auto;height:auto;clip:auto;margin:0;padding:10px 16px;background:var(--surface);border-radius:12px;z-index:50;outline:3px solid var(--primary)}
 .pcard h3:focus{outline:3px solid var(--primary);outline-offset:4px;border-radius:6px}
 .pcard .coming{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:34px;padding:4px 12px;border-radius:999px;background:var(--success-soft);color:var(--success);font-weight:800;font-size:.9375rem}
 .pcard .coming svg,.rec-done svg{width:18px;height:18px;flex:none}
 .rec-done{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--success);max-width:320px}
 .live.stale i{background:var(--honey)}
 .lost{border:2px solid var(--honey);background:#FFFCF2;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
 .ci-rows{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
 .ci-rows li{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
 .ci-text{font-weight:800;font-size:1.0625rem}
 .ci-who{margin-top:6px;font-size:.9375rem;color:var(--muted)}
 .ci-who a{color:var(--primary);font-weight:700}
 .passport{display:flex;flex-direction:column;gap:18px}
 .pp-kicker{font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.06em;font-size:.8125rem}
 .pp-name{font-size:1.75rem;margin-top:2px}
 .pp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px}
 .pp-sec h2{font-size:1.125rem}
 .pp-sec ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
 .pp-foot{border-top:1px solid var(--border);padding-top:12px;color:var(--muted);font-size:.9375rem}
 @media (max-width:767px){.pp-grid{grid-template-columns:minmax(0,1fr)}.pp-name{font-size:1.5rem}}
 @media print{
  @page{size:A4;margin:15mm}
  html,body{background:#fff!important;color:#000!important}
  .side,.demo-strip,.top-tools,.top .sub,.menu-btn,.pp-tools,.toast,a.sr-only{display:none!important}
  .app{display:block!important;min-height:0!important}.main{padding:0!important;margin:0!important;background:#fff!important}.page{max-width:none!important;padding:0!important;margin:0!important}
  .top{margin:0 0 6mm!important}#page-h{font-size:18pt!important}
  .passport{box-shadow:none!important;border:0!important;padding:0!important;background:#fff!important;color:#000!important;gap:5mm}
  .passport .muted,.pp-foot{color:#333!important}.pp-kicker{color:#000!important}
  .pp-grid{gap:5mm 8mm}.pp-sec{break-inside:avoid}.pp-sec h2{font-size:12pt}.pp-sec ul{font-size:10.5pt}.pp-name{font-size:16pt}
 }
 .fopts{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
 .fopt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;padding:14px 16px;border:1px solid var(--border);border-radius:16px;cursor:pointer;min-height:56px}
 .fopt:has(input:checked){border:2px solid var(--primary);padding:13px 15px;background:var(--primary-soft)}
 .fopt input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--primary)}
 .fopt span{display:flex;flex-direction:column;gap:4px;min-width:0}
 .fopt .muted{font-size:.9375rem}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
<script src="/v2/lesson-core.js"></script>
<script src="/v2/lessons.js"></script>
<script src="/v2/lights.js"></script>
</head>

<div id="app"><main class="main" id="main"><div class="page"><p class="muted" role="status">Загружаем…</p></div></main></div>
<script type="module" src="/v2/adult.mjs"></script>
</body>
</html>
