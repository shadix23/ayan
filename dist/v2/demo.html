<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аян · демо</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/ayan-mark.svg">
<link rel="stylesheet" href="/v2/tokens.css">
<link rel="stylesheet" href="/v2/lights.css">
</head>
<body>
<div class="demo-strip"><span data-t="strip"></span></div>
<main class="main" id="main" style="max-width:1080px;margin:0 auto">
 <div class="page">
  <div class="top"><div><h1 data-t="h1"></h1><p class="sub" data-t="sub"></p></div>
   <div class="top-tools" role="group" aria-label="Язык / Тіл"><button type="button" class="tool" data-setlang="kk" aria-pressed="false">Қазақша</button><button type="button" class="tool" data-setlang="ru" aria-pressed="false">Русский</button></div></div>
  <section class="card soft between" aria-labelledby="split-h"><div style="max-width:60ch"><h2 id="split-h" data-t="splitH"></h2><p class="sub" style="margin-top:8px" data-t="splitP"></p></div>
   <button type="button" class="btn primary push" data-split><span class="face" data-t="splitBtn"></span></button></section>
  <div class="roles" id="roles"></div>
  <section class="card stack" aria-labelledby="more-h"><h2 id="more-h" data-t="moreH"></h2>
   <details><summary style="cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center" data-t="allAcc"></summary><div class="grid3" id="accounts" style="margin-top:12px"></div></details>
   <div class="row"><button type="button" class="btn inline" id="reset" data-t="reset"></button><span class="status-line" id="st" role="status"></span></div></section>
 </div>
</main>
<script type="module">
// Local demo only (AYAN_DEMO=1): pick a role, or open the child and the teacher side by side for a live defence.
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T={
 strip:['Локальное демо: отдельная база с синтетическими данными. Это не результаты реальных детей.','Жергілікті демо: синтетикалық деректері бар бөлек база. Бұл нақты балалардың нәтижесі емес.'],
 h1:['Аян: демо','Аян: демо'],sub:['Вход без пароля работает только в локальном демо. Язык интерфейса выбирается здесь.','Құпиясөзсіз кіру тек жергілікті демода жұмыс істейді. Интерфейс тілі осында таңдалады.'],
 splitH:['Сплит-экран для защиты','Қорғауға арналған екі экран'],splitP:['Слева ученик, справа учитель. Перерыв или просьба ученика появляются у учителя за 3 секунды без перезагрузки.','Сол жақта оқушы, оң жақта мұғалім. Оқушының үзілісі немесе өтініші мұғалімде 3 секундта жаңартусыз пайда болады.'],
 splitBtn:['Открыть сплит-экран','Екі экранды ашу'],moreH:['Другие аккаунты и данные','Басқа аккаунттар мен деректер'],allAcc:['Все демо-аккаунты','Барлық демо-аккаунттар'],
 reset:['Сбросить демо-данные','Демо-деректерді қалпына келтіру'],resetting:['Сбрасываем…','Қалпына келтіріп жатырмыз…'],resetOk:['Демо-данные созданы заново: Ученик 01 перед уроком «Равные доли».','Демо-деректер қайта жасалды: 01 оқушы «Тең үлестер» сабағының алдында.'],resetFail:['Не удалось сбросить.','Қалпына келтіру мүмкін болмады.'],
 child:['Я ученик','Мен оқушымын'],childP:['Ученик 01: тропинка огоньков, урок в фокус-режиме, перерыв и помощь.','01 оқушы: шырақтар соқпағы, фокус режиміндегі сабақ, үзіліс пен көмек.'],
 teacher:['Я учитель','Мен мұғаліммін'],teacherP:['Учитель A: кто сейчас просит помощь, отчёт «что помогло», следующий шаг одной кнопкой.','A мұғалімі: қазір кім көмек сұрайды, «не көмектесті» есебі, келесі қадам бір түймемен.'],
 parent:['Я родитель','Мен ата-анамын'],parentP:['Отчёт по ребёнку: уроки, дни со светом, что повторить дома.','Бала бойынша есеп: сабақтар, жарық күндер, үйде не қайталау керек.'],
 go:['Войти','Кіру'],org:['организация','ұйым'],roles:{teacher:['Учитель','Мұғалім'],admin:['Администратор','Әкімші'],child:['Ученик','Оқушы'],parent:['Родитель','Ата-ана']}
};
// The choice is stored only when the presenter presses a language button (tests and fresh browsers start in Russian).
let LANG=(()=>{try{return localStorage.getItem('ayan.v2.lang')||'ru';}catch{return 'ru';}})();
const tr=k=>(T[k]||[k,k])[LANG==='kk'?1:0];
const ICON={child:'<path d="M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/><path d="M5 21a7 7 0 0 1 14 0"/>',teacher:'<path d="M3 12h4l2.5-6 4 12 2.5-6H21"/>',parent:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
let list=[];
async function login(as){const r=await fetch('/api/demo/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({as})});return r.json();}
function draw(){
 document.documentElement.lang=LANG==='kk'?'kk':'ru';
 document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=tr(el.dataset.t);});
 document.querySelectorAll('[data-setlang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.setlang===LANG)));
 document.getElementById('roles').innerHTML=[['child','student-01'],['teacher','teacher-a'],['parent','parent-01']].map(([k,as])=>`<section class="card role" data-role-card="${k}"><span class="ico">${svg(k)}</span><b>${esc(tr(k))}</b><p class="muted">${esc(tr(k+'P'))}</p><button type="button" class="btn primary" data-as="${as}">${esc(tr('go'))}</button></section>`).join('');
 document.getElementById('accounts').innerHTML=list.map(a=>`<section class="card stack"><span class="badge grey">${esc(T.roles[a.role]?.[LANG==='kk'?1:0]||a.role)} · ${esc(tr('org'))} ${esc(a.org)}</span><b>${esc(a.label)}</b><button type="button" class="btn" data-as="${esc(a.as)}" style="margin-top:auto">${esc(tr('go'))}</button></section>`).join('');
}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.setlang){LANG=b.dataset.setlang;try{localStorage.setItem('ayan.v2.lang',LANG);localStorage.setItem('ayan.v2.demoLang',LANG);}catch{}draw();return;}
 if(b.dataset.as){b.setAttribute('aria-busy','true');const d=await login(b.dataset.as);if(d.go)location.href=d.go;return;}
 if(b.hasAttribute('data-split')){b.setAttribute('aria-busy','true');await login('teacher-a');await login('student-01');location.href='/demo/split';return;}
 if(b.id==='reset'){const st=document.getElementById('st');st.textContent=tr('resetting');const r=await fetch('/api/demo/reset',{method:'POST'});
  // drafts and queued writes of the old synthetic accounts are dropped too, so the next run starts clean
  try{for(const k of Object.keys(localStorage))if(/^ayan\.v2\.(child|outbox)/.test(k))localStorage.removeItem(k);sessionStorage.removeItem('ayan.v2.acked');}catch{}st.textContent=r.ok?tr('resetOk'):tr('resetFail');}
});
list=await (await fetch('/api/demo/accounts')).json();draw();
</script>
</body>
</html>
