<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img"><title>Профиль поддержки</title><defs><linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5FBFA"/><stop offset=".55" stop-color="#C5E1E0"/><stop offset="1" stop-color="#8CB8C1"/></linearGradient></defs><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F7FAF8" stroke="none" stroke-width="1"/><rect x="0" y="0" width="248" height="1024" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="30" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#0F766E">EdTech</text><text x="30" y="87" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#526475">УЧИМСЯ ПО-СВОЕМУ</text><rect x="32" y="126" width="24" height="24" rx="7" fill="#E5EDE8" stroke="none" stroke-width="1"/><text x="70" y="144" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526475">Мои ученики</text><rect x="32" y="194" width="24" height="24" rx="7" fill="#E5EDE8" stroke="none" stroke-width="1"/><text x="70" y="212" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526475">Назначить урок</text><rect x="32" y="262" width="24" height="24" rx="7" fill="#E5EDE8" stroke="none" stroke-width="1"/><text x="70" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526475">Отчёты</text><rect x="16" y="317" width="216" height="56" rx="16" fill="#E7F2ED" stroke="none" stroke-width="1"/><rect x="32" y="330" width="24" height="24" rx="7" fill="#C4DCD2" stroke="none" stroke-width="1"/><text x="70" y="348" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#0F766E">Профили поддержки</text><rect x="32" y="398" width="24" height="24" rx="7" fill="#E5EDE8" stroke="none" stroke-width="1"/><text x="70" y="416" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526475">Редактор уроков</text><rect x="32" y="466" width="24" height="24" rx="7" fill="#E5EDE8" stroke="none" stroke-width="1"/><text x="70" y="484" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526475">Библиотека</text><rect x="20" y="838" width="208" height="144" rx="20" fill="#E7F2ED" stroke="none" stroke-width="1"/><text x="38" y="870" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#243342">В своём темпе</text><text x="38" y="900" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#526475">Можно повторить</text><text x="38" y="924" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#526475">и сделать перерыв.</text><text x="288" y="70" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#243342">Профиль поддержки · Ученик 01</text><text x="288" y="107" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526475">Демонстрационные данные · Доступ только назначенным взрослым</text><rect x="1110" y="35" width="104" height="40" rx="12" fill="white" stroke="#DFE7E2" stroke-width="1"/><text x="1124" y="61" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#526475">ҚАЗ / РУС</text><rect x="1230" y="35" width="170" height="40" rx="12" fill="#E7F2ED" stroke="#0F766E" stroke-width="1"/><text x="1244" y="61" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#0F766E">Тихий режим</text><rect x="288" y="150" width="536" height="360" rx="24" fill="#E7F2ED" stroke="#DFE7E2" stroke-width="1"/><text x="312" y="190" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#243342">Комфорт и доступность</text><text x="312" y="222" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526475">Выбор ученика, а не диагноз</text><text x="314" y="270" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#243342">Интерфейс: спокойный</text><text x="314" y="321" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#243342">Движение: минимум</text><text x="314" y="372" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#243342">Голос: выключен</text><text x="314" y="423" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#243342">В этом занятии: 2D</text><rect x="848" y="150" width="552" height="360" rx="24" fill="white" stroke="#DFE7E2" stroke-width="1"/><text x="872" y="190" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#243342">Учебные наблюдения</text><text x="874" y="250" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526475">Сильная сторона: выбор долей на схеме.</text><text x="874" y="302" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526475">Повторить: сравнение частей.</text><text x="874" y="354" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526475">Помогла визуальная подсказка.</text><text x="874" y="406" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526475">Не является постоянным ярлыком.</text><rect x="288" y="538" width="1112" height="292" rx="24" fill="white" stroke="#DFE7E2" stroke-width="1"/><text x="312" y="578" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#243342">Заметка учителя</text><text x="312" y="610" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526475">Факт, контекст, дата и автор — отдельно от результата.</text><rect x="314" y="633" width="1058" height="88" rx="12" fill="#F7FAF8" stroke="#DFE7E2" stroke-width="1"/><text x="338" y="682" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#243342">После примера выполнил следующее задание самостоятельно.</text><rect x="1090" y="748" width="280" height="56" rx="16" fill="#0F766E" stroke="#0F766E" stroke-width="1"/><text x="1112" y="783" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white">Сохранить заметку</text><rect x="288" y="858" width="260" height="56" rx="16" fill="white" stroke="#879A96" stroke-width="1"/><text x="310" y="893" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#243342">История изменений</text><rect x="1100" y="858" width="300" height="56" rx="16" fill="white" stroke="#879A96" stroke-width="1"/><text x="1122" y="893" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#243342">Управление данными</text></svg>