ill="#E5EDE8" stroke="none" stroke-width="1"/><text x="70" y="484" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526475">Библиотека</text><rect x="20" y="838" width="208" height="144" rx="20" fill="#E7F2ED" stroke="none" stroke-width="1"/><text x="38" y="870" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#243342">В своём темпе</text><text x="38" y="900" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#526475">Можно повторить</text><text x="38" y="924" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#526475">и сделать перерыв.</text><text x="288" y="70" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#243342">Что получилось на уроке?</text><text x="288" y="107" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526475">Демо-класс · Дроби · Только синтетические данные</text><rect x="1110" y="35" width="104" height="40" rx="12" fill="white" stroke="#DFE7E2" stroke-width="1"/><text x="1124" y="61" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#526475">ҚАЗ / РУС</text><rect x="1230" y="35" width="170" height="40" rx="12" fill="#E7F2ED" stroke="#0F766E" stroke-width="1"/><text x="1244" y="61" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#0F766E">Тихий режим</text><rect x="288" y="150" width="356" height="158" rx="24" fill="white" stroke="#DFE7E2" stroke-width="1"/><text x="312" y="190" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#243342">Завершили</text><text x="312" y="252" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#0F766E">8 / 10</text><text x="312" y="281" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#526475">Уникальные попытки</text><rect x="666" y="150" width="356" height="158" rx="24" fill="white" stroke="#DFE7E2" stroke-width="1"/><text x="690" y="190" font-family="Arial, sans-serif" font-size="2