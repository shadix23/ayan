="17" font-weight="400" fill="#526475">Практика</text><text x="662" y="553" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#243342">В работе</text><text x="792" y="553" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#0F766E">Перерыв</text><rect x="310" y="607" width="676" height="70" rx="12" fill="#F7FAF8" stroke="none" stroke-width="1"/><text x="326" y="641" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#243342">Ученик 03</text><text x="490" y="641" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526475">Пример</text><text x="662" y="641" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#243342">В работе</text><text x="792" y="641" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#0F766E">Нет запросов</text><rect x="1032" y="334" width="368" height="396" rx="24" fill="#E7F2ED" stroke="#DFE7E2" stroke-width="1"/><text x="1056" y="374" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#243342">Наблюдение по занятию</text><text x="1056" y="433" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#243342">После визуального примера</text><text x="1056" y="468" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#243342">следующее задание выполнено</text><text x="1056" y="503" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#243342">без подсказки.</text><text x="1056" y="538" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#243342"></text><text x="1056" y="573" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#243342">Предложить ещё одно</text><text x="1056" y="608" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#243342">упражнение на доли.</text><rect x="288" y="756" width="1112" height="140" rx="24" fill="white" stroke="#DFE7E2" stroke-width="1"/><text x="312" y="796" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#243342">События различаются</text><text x="312" y="828" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526475">Верный ответ · помощь · перерыв · техническая ошибка · ответ после подсказки</text><rect x="1050" y="819" width="320" height="56" rx="16" fill="white" stroke="#879A96" stroke-width="1"/><text x="1072" y="854" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#243342">Открыть отчёт ученика</text></svg>